events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # Upstream services di Docker
    upstream backend_api {
        server api:5000;
    }

    upstream frontend_client {
        server client:80;
    }

    server {
        listen 80;
        server_name go.createdbylenix.my.id;

        # Endpoint untuk verifikasi sertifikat SSL Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Teruskan semua lalu lintas HTTP biasa ke HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name go.createdbylenix.my.id;

        # Sertifikat SSL dari Certbot
        ssl_certificate /etc/letsencrypt/live/go.createdbylenix.my.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/go.createdbylenix.my.id/privkey.pem;

        # 1. Teruskan endpoint API
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Rute halaman Statistik Blazor (SPA Navigation)
        location /stats/ {
            proxy_pass http://frontend_client;
            proxy_set_header Host $host;
        }

        # 3. KUNCI: Pola Regex Base62 untuk Redirect Kode URL Pendek
        # Karakter alfanumerik 6-12 digit langsung ditembakkan ke endpoint /{code} API
        location ~ ^/[a-zA-Z0-9]{5,15}$ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Layani antarmuka beranda Blazor dan aset statis lainnya
        location / {
            proxy_pass http://frontend_client;
            proxy_set_header Host $host;
        }
    }
}