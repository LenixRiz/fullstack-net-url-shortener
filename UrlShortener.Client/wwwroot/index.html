<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrlShortener.Client</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="UrlShortener.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        window.chartInstance = {};
        window.renderDailyClicksChart = (canvasId, labels, dataPoints) => {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            const gradient = ctx.createLinearGradient(0, 0, 0, 280);
            gradient.addColorStop(0, 'rgba(13, 110, 253, 0.9)');
            gradient.addColorStop(1, 'rgba(13, 110, 253, 0.15)');

            if (window.chartInstance[canvasId]) {
                window.chartInstance[canvasId].destroy();
            }

            window.chartInstance[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                        labels: labels,
                        datasets: [{
                        label: 'Total Visit',
                        data: dataPoints,
                        backgroundColor: gradient,
                        borderColor: 'rgb(13, 110, 253)',
                        borderWidth: 1.5,
                        borderRadius: 8,  
                        borderSkipped: false,   
                        hoverBackgroundColor: 'rgba(13, 110, 253, 1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 750,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(33, 37, 41, 0.92)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            titleFont: { size: 13, weight: 'bold' },
                            bodyFont: { size: 12 },
                            padding: 10,
                            cornerRadius: 8,
                            displayColors: false,
                            callbacks: {
                                title: (items) => `Date: ${items[0].label}`,
                                label: (context) => `${context.parsed.y} visits`
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0,
                                color: '#6c757d'
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)',
                                drawBorder: false
                            }
                        },
                        x: {
                            ticks: {
                                color: '#6c757d',
                                font: { weight: '500' }
                            },
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            })
        }
    </script>
</body>
</html>
